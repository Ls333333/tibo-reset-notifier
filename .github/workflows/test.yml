name: Reliability tests
on:
  push:
    paths:
      - "watcher/**"
      - "tests/**"
      - "main.py"
      - ".github/workflows/**"
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
