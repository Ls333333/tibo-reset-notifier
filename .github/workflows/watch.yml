name: Tibo reset notifications

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = normal run; test = test phone/email; prime = baseline without history"
        required: true
        default: check
        type: choice
        options: [check, test, prime]

permissions:
  contents: write

concurrency:
  group: tibo-notifications
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUTF8: "1"
      STATE_FILE: runtime_state.json
      WATCH_CHANGELOG: "0"
      TIBO_HANDLE: thsottiaux
      INCLUDE_REPLIES: "1"
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      PUSHPLUS_CHANNEL: wechat
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      RUN_MODE: ${{ inputs.mode || 'check' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check notification configuration
        run: |
          python -c "from watcher.config import load_config; c=load_config(); assert c.active_channels(), 'Configure PUSHPLUS_TOKEN or SMTP secrets before enabling monitoring'"
      - name: Check or test notifications
        run: |
          case "$RUN_MODE" in
            test) python main.py --test-notify ;;
            prime) python main.py --prime ;;
            check) python main.py ;;
            *) exit 2 ;;
          esac

      - name: Persist baseline and pending notifications
        if: always() && env.RUN_MODE != 'test'
        run: |
          if [ ! -f runtime_state.json ]; then exit 0; fi
          git config user.name  "tibo-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f runtime_state.json
          if git diff --cached --quiet; then
            echo "state unchanged, nothing to commit"
          else
            git commit -m "state: persist notification results [skip ci]"
            git push
          fi
